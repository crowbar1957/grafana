name: Build Release Packages
on:
  workflow_dispatch:
    inputs:
      source-event:
        description: If this workflow was triggered by another workflow, this value should be set to the GITHUB_EVENT_NAME of that source workflow.
        type: string
        required: false
        default: workflow_dispatch

permissions:
  contents: read

# Builds the following artifacts:
#
# targz:grafana:* (via make build-targz)
# deb / rpm (via make build-deb / build-rpm, from targz)
# docker alpine / alpine-slim / ubuntu / ubuntu-slim / distroless / distroless-slim (via make build-docker*, from targz)
# zip / msi (Dagger, consuming prebuilt targz from dist)
#
# One shared frontend artifact is reused for every targz matrix cell (OSS), so assets-manifest.json matches all
# binaries. For Grafana Cloud / Enterprise / Pro with CDN, do not split frontend and backend across pipelines
# unless they consume the same frontend output—see pkg/build/daggerbuild/README.md.
#
jobs:
  setup:
    name: setup
    runs-on: ubuntu-x64-small
    # grafana/grafana builds only main (push/schedule/dispatch); release-candidate builds
    # now run in the mirror.
    outputs:
      version: ${{ steps.output.outputs.version }}
      grafana-commit: ${{ steps.output.outputs.grafana_commit }}
      public-commit: ${{ steps.output.outputs.public_commit }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up version (Release Branches)
        if: startsWith(github.ref_name, 'release-')
        # Drop the leading release- and any trailing #patched (the patched mirror branch
        # suffix) so the version is clean, e.g. release-13.0.0#patched -> 13.0.0. A
        # +security suffix is preserved (release-13.0.0+security-01 -> 13.0.0+security-01).
        run: |
          version="${REF_NAME#release-}"
          version="${version%\#patched}"
          echo "$version" > VERSION
        env:
          REF_NAME: ${{ github.ref_name }}
      - name: Set up version (Non-release branches)
        if: ${{ !startsWith(github.ref_name, 'release-') }}
        run: jq -r .version package.json | sed -s "s/pre/${BUILD_ID}/g" > VERSION
        env:
          REF_NAME: ${{ github.ref_name }}
          BUILD_ID: ${{ github.run_id }}
      - id: output
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          # grafana_commit is the source pin (#patched HEAD in the mirror) — it drives every
          # clone/checkout (enterprise/upstream + the build checkouts). Do NOT repoint it.
          echo "grafana_commit=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"

          # public_commit is the commit STAMPED into the binary (-X main.commit). For a mirror
          # #patched build it's the sibling unpatched branch HEAD — a real grafana/grafana
          # commit — so artifacts advertise a public commit instead of the mirror-only one.
          # Everywhere else it's just the checkout HEAD. This value is only ever passed to the
          # Makefile's COMMIT_SHA; it is never used as a checkout/clone ref.
          if [ "$GITHUB_REPOSITORY" = "grafana/grafana-security-mirror" ] && [[ "$REF_NAME" == *'#patched' ]]; then
            sibling="${REF_NAME%\#patched}"
            public_commit=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${sibling}" --jq '.object.sha')
          else
            public_commit=$(git rev-parse HEAD)
          fi
          echo "public_commit=${public_commit}" | tee -a "$GITHUB_OUTPUT"

  build-frontend:
    name: build frontend
    runs-on: ubuntu-x64-large
    needs: [setup]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: Install JS dependencies
        run: yarn install --immutable
      - name: Build frontend
        run: yarn build
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: release-frontend
          path: public
          retention-days: 1

  build-targz:
    name: targz / ${{ matrix.name }}
    runs-on: ubuntu-x64-large
    continue-on-error: ${{ matrix.allow-failure == true }}
    needs:
      - setup
      - build-frontend
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: linux
            arch: amd64
          - name: linux-arm64
            os: linux
            arch: arm64
          - name: linux-s390x
            os: linux
            arch: s390x
          - name: linux-armv6
            os: linux
            arch: arm
            arm: '6'
          - name: linux-armv7
            os: linux
            arch: arm
            arm: '7'
          # riscv64 is not an officially supported architecture; failures are allowed.
          - name: linux-riscv64
            os: linux
            arch: riscv64
            allow-failure: true
          - name: windows-amd64
            os: windows
            arch: amd64
          - name: windows-arm64
            os: windows
            arch: arm64
          - name: darwin-amd64
            os: darwin
            arch: amd64
          - name: darwin-arm64
            os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-targz
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
          arm: ${{ matrix.arm }}
          build-number: ${{ github.run_id }}
          build-version: ${{ needs.setup.outputs.version }}
          frontend-artifact: release-frontend
      - name: Generate checksums
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz; do
            [ -e "$f" ] || continue
            sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
          done
      - name: Write artifact list
        run: |
          listfile="artifacts-list-packages-${{ matrix.name }}.txt"
          : > "$listfile"
          for f in dist/*.tar.gz; do
            [ -e "$f" ] || continue
            echo "$f" >> "$listfile"
            echo "${f}.sha256" >> "$listfile"
          done
      - name: Stage artifacts for upload
        run: |
          set -euo pipefail
          mkdir -p "upload/artifacts-list-packages-${{ matrix.name }}"
          cp "artifacts-list-packages-${{ matrix.name }}.txt" "upload/artifacts-list-packages-${{ matrix.name }}/"
          mkdir -p "upload/artifacts-packages-${{ matrix.name }}"
          cp -R dist/. "upload/artifacts-packages-${{ matrix.name }}/"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: artifacts-list-packages-${{ matrix.name }}
          path: upload/artifacts-list-packages-${{ matrix.name }}
          retention-days: 1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: artifacts-packages-${{ matrix.name }}
          path: upload/artifacts-packages-${{ matrix.name }}
          retention-days: 1

  verify-targz:
    name: verify targz (linux-amd64)
    needs:
      - build-targz
    uses: ./.github/workflows/release-verify.yml
    with:
      run-id: ${{ github.run_id }}
      targz-artifact-name: artifacts-packages-linux-amd64

  publish-targz:
    name: Upload targz / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
          - target: linux-arm64
          - target: linux-s390x
          - target: linux-armv6
          - target: linux-armv7
          # riscv64 is not an officially supported architecture; failures are allowed.
          - target: linux-riscv64
            allow-failure: true
          - target: windows-amd64
          - target: windows-arm64
          - target: darwin-amd64
          - target: darwin-arm64
    uses: grafana/grafana/.github/workflows/publish-artifact.yml@main
    permissions:
      id-token: write
    needs:
      - setup
      - build-targz
    with:
      bucket: grafana-prerelease
      pattern: artifacts-*packages-${{ matrix.target }}
      run-id: ${{ github.run_id }}
      bucket-path: ${{ needs.setup.outputs.version }}_${{ github.run_id }}
      environment: prod
      runs-on: ubuntu-x64-small
